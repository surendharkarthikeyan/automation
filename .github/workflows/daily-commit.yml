
name: Daily GitHub Activity

on:
  schedule:
    - cron: '23 6 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Git
        run: |
          git config user.name "${{ secrets.COMMIT_NAME }}"
          git config user.email "${{ secrets.COMMIT_EMAIL }}"

      - name: Update activity log
        run: |
          echo "$(date -u +'%Y-%m-%d') - Daily activity" >> activity.log

      - name: Commit and push
        run: |
          git add activity.log
          git commit -m "chore: daily activity update"
          git push origin HEAD
